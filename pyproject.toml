[project]
name = "aliasvault-backup"
version = "0.1.0"
description = "Unofficial, independent backup tool for AliasVault vaults"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PaulExplorer" }]
keywords = ["aliasvault", "backup", "password-manager", "avex", "avux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/PaulExplorer/AliasVaultBackup"
Repository = "https://github.com/PaulExplorer/AliasVaultBackup"
Issues = "https://github.com/PaulExplorer/AliasVaultBackup/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
avb = "aliasvault_backup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aliasvault_backup"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "/tests/**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
